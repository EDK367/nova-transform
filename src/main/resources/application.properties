quarkus.application.name=nova-transform

# server
quarkus.http.port=8080

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}/${DB_NAME}

# hibernate
quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true

# flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db_migration

# swagger
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger

# jwt
%dev.mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://nova-transform.com/issuer
smallrye.jwt.sign.key.location=privateKey.pem
%dev.quarkus.native.resources.includes=publicKey.pem,privateKey.pem
smallrye.jwt.sign.algorithm=RS256
jwt.duration=3600


# limitaciones
quarkus.oidc.enabled=false
quarkus.log.level=INFO
quarkus.log.category."org.nova".level=DEBUG