quarkus.application.name=nova-transform

# Server
quarkus.http.port=8080

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true

# Flyway
quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.repair-at-start=true
quarkus.flyway.locations=db/migration

# Swagger
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=false

# JWT
# --- Producción (Render): las claves se leen desde variables de entorno ---
# MP_JWT_VERIFY_PUBLICKEY  → contenido completo del publicKey.pem
# SMALLRYE_JWT_SIGN_KEY    → contenido completo del privateKey.pem
%dev.mp.jwt.verify.publickey.location=publicKey-derived.pem
mp.jwt.verify.publickey=${MP_JWT_VERIFY_PUBLICKEY}
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.issuer=https://nova-transform.com/issuer

%dev.smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.sign.key=${SMALLRYE_JWT_SIGN_KEY}

smallrye.jwt.new-token.signature-algorithm=RS256
jwt.duration=3600

%dev.quarkus.native.resources.includes=publicKey-derived.pem,privateKey.pem

# Diagnóstico temporal de JWT
%dev.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth".level=TRACE
%dev.quarkus.log.category."io.smallrye.jwt".level=TRACE
%dev.quarkus.log.category."io.smallrye.jwt".min-level=TRACE

# Limitaciones
quarkus.oidc.enabled=false
quarkus.log.level=INFO
quarkus.log.category."org.nova".level=DEBUG

# CORS para frontend React
quarkus.http.cors.enabled=true
# En producción se leen los orígenes desde la variable CORS_ORIGINS
quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD

# Correo
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}
%test.resend.api-key=